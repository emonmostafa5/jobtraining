name: Java CI with Security and Coverage

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:

  build-test:

    name: Build, Test and Coverage

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v6

      # 2. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Build
      - name: Build
        run: mvn clean compile

      # 4. Unit Tests + JaCoCo
      - name: Run tests with coverage
        run: mvn test jacoco:report

      # 5. Show test results
      - name: Show test results
        if: always()
        run: |
          echo "Test reports:"
          find target -type f -name "*.xml" | head -20

      # 6. Upload JaCoCo report
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      # 7. Package
      - name: Package application
        run: mvn package


  sast:

    name: SAST - CodeQL

    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java

      - name: Build for CodeQL
        run: mvn clean compile

      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v4


  sca:

    name: SCA - Dependency Review

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always


  jacoco-pr:

    name: JaCoCo PR Coverage

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Generate JaCoCo report
        run: mvn clean test jacoco:report

      - name: Add coverage to Pull Request
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: |
            ${{ github.workspace }}/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 70
          min-coverage-changed-lines: 70
          update-comment: true
          comment-type: both
          title: "JaCoCo Code Coverage"
